<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection API Test Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 { color: #333; text-align: center; margin-bottom: 10px; font-size: 28px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
        .section { margin-bottom: 30px; }
        .section-title { color: #667eea; font-size: 18px; margin-bottom: 15px; font-weight: 600; }
        .input-group { margin-bottom: 20px; }
        label { display: block; color: #555; margin-bottom: 8px; font-weight: 500; }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .result-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .result-box.show { display: block; }
        .result-box.success { background: #d4edda; border: 2px solid #c3e6cb; }
        .result-box.error { background: #f8d7da; border: 2px solid #f5c6cb; }
        .result-title { font-weight: 600; margin-bottom: 10px; font-size: 16px; }
        .result-content {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .preview-box { margin-top: 15px; text-align: center; }
        .preview-box img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .webcam-container { position: relative; margin-top: 15px; text-align: center; }
        .webcam-container video, .webcam-container canvas {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .webcam-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .emotion-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin: 5px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }
        .spinner.show { display: block; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Emotion Detection API Test Client</h1>
        <p class="subtitle">Test your emotion detection API endpoints</p>
        
        <div class="section">
            <div class="section-title">⚙️ API Configuration</div>
            <div class="input-group">
                <label for="apiUrl">API Base URL:</label>
                <input type="text" id="apiUrl" value="http://localhost:8000">
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">🔍 Test Endpoints</div>
            <div class="button-group">
                <button class="btn-secondary" onclick="testRoot()">Test / (Info)</button>
                <button class="btn-secondary" onclick="testHealth()">Test /health</button>
                <button class="btn-secondary" onclick="testEmotions()">Test /emotions</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📹 Live Webcam Emotion Detection</div>
            <div class="button-group">
                <button class="btn-primary" onclick="startWebcam()">▶️ Start Camera</button>
                <button class="btn-secondary" onclick="stopWebcam()">⏹️ Stop Camera</button>
            </div>
            <div class="webcam-container">
                <video id="webcam" autoplay playsinline style="display: none;"></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div id="webcamOverlay" class="webcam-overlay" style="display: none;"></div>
            </div>
            <div id="liveResults" style="margin-top: 15px; text-align: center;"></div>
        </div>
        
        <div class="section">
            <div class="section-title">📸 Test Emotion Prediction (Upload Image)</div>
            <div class="input-group">
                <label for="imageFile">Select an image with a face:</label>
                <input type="file" id="imageFile" accept="image/*" onchange="previewImage()">
            </div>
            <div class="preview-box" id="previewBox"></div>
            <button class="btn-primary" onclick="testPredict()" style="width: 100%; margin-top: 15px;">
                🚀 Predict Emotion
            </button>
        </div>
        
        <div class="spinner" id="spinner"></div>
        
        <div class="result-box" id="resultBox">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

    <script>
        function getApiUrl() { return document.getElementById('apiUrl').value.trim(); }
        function showLoading(show) { document.getElementById('spinner').className = show ? 'spinner show' : 'spinner'; }
        function showResult(title, content, isSuccess) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultContent').textContent = typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
            document.getElementById('resultBox').className = 'result-box show ' + (isSuccess ? 'success' : 'error');
        }
        async function testRoot() {
            showLoading(true);
            try {
                const response = await fetch(getApiUrl() + '/');
                const data = await response.json();
                showResult('✅ API Info Response', data, true);
            } catch (error) {
                showResult('❌ Error', error.message, false);
            } finally {
                showLoading(false);
            }
        }
        async function testHealth() {
            showLoading(true);
            try {
                const response = await fetch(getApiUrl() + '/health');
                const data = await response.json();
                showResult((response.status === 200 ? '✅ Healthy' : '⚠️ Unhealthy') + ' - Health Check Response', data, response.status === 200);
            } catch (error) {
                showResult('❌ Error', error.message, false);
            } finally {
                showLoading(false);
            }
        }
        async function testEmotions() {
            showLoading(true);
            try {
                const response = await fetch(getApiUrl() + '/emotions');
                const data = await response.json();
                showResult('✅ Emotions List Response', data, response.status === 200);
            } catch (error) {
                showResult('❌ Error', error.message, false);
            } finally {
                showLoading(false);
            }
        }
        function previewImage() {
            const file = document.getElementById('imageFile').files[0];
            const previewBox = document.getElementById('previewBox');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { previewBox.innerHTML = '<img src="' + e.target.result + '" alt="Preview">'; };
                reader.readAsDataURL(file);
            } else {
                previewBox.innerHTML = '';
            }
        }
        async function testPredict() {
            const file = document.getElementById('imageFile').files[0];
            if (!file) { showResult('⚠️ No Image Selected', 'Please select an image file first.', false); return; }
            showLoading(true);
            try {
                const base64 = await fileToBase64(file);
                const response = await fetch(getApiUrl() + '/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64.split(',')[1] })
                });
                const data = await response.json();
                showResult(response.ok ? '🎭 Emotion Prediction Result' : '❌ Prediction Failed', data, response.ok);
            } catch (error) {
                showResult('❌ Error', error.message, false);
            } finally {
                showLoading(false);
            }
        }
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
        
        let webcamStream = null;
        let webcamInterval = null;
        let isWebcamRunning = false;
        
        async function startWebcam() {
            try {
                const video = document.getElementById('webcam');
                const canvas = document.getElementById('canvas');
                const overlay = document.getElementById('webcamOverlay');
                webcamStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = webcamStream;
                video.style.display = 'block';
                overlay.style.display = 'block';
                overlay.textContent = '🟢 Camera Active';
                isWebcamRunning = true;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    webcamInterval = setInterval(captureAndPredict, 1000);
                };
                showResult('✅ Webcam Started', 'Camera is active. Detecting emotions every second...', true);
            } catch (error) {
                showResult('❌ Webcam Error', 'Could not access webcam: ' + error.message, false);
            }
        }
        
        function stopWebcam() {
            const video = document.getElementById('webcam');
            const overlay = document.getElementById('webcamOverlay');
            const liveResults = document.getElementById('liveResults');
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
            if (webcamInterval) {
                clearInterval(webcamInterval);
                webcamInterval = null;
            }
            video.style.display = 'none';
            overlay.style.display = 'none';
            liveResults.innerHTML = '';
            isWebcamRunning = false;
            showResult('⏹️ Webcam Stopped', 'Camera has been stopped.', true);
        }
        
        async function captureAndPredict() {
            if (!isWebcamRunning) return;
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const liveResults = document.getElementById('liveResults');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64 = canvas.toDataURL('image/jpeg', 0.8);
            try {
                const response = await fetch(getApiUrl() + '/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64.split(',')[1] })
                });
                const data = await response.json();
                if (response.ok && data.emotion) {
                    document.getElementById('webcamOverlay').innerHTML = '�� ' + data.emotion + '<br>📊 ' + (data.confidence * 100).toFixed(1) + '%';
                    const emotionColors = {
                        'Happy': '#28a745', 'Sad': '#17a2b8', 'Angry': '#dc3545',
                        'Fear': '#6f42c1', 'Surprise': '#ffc107', 'Disgust': '#fd7e14', 'Neutral': '#6c757d'
                    };
                    const color = emotionColors[data.emotion] || '#667eea';
                    liveResults.innerHTML = '<div class="emotion-badge" style="background-color: ' + color + '; color: white;">' +
                        data.emotion + ': ' + (data.confidence * 100).toFixed(1) + '%</div>' +
                        '<div style="font-size: 12px; color: #666; margin-top: 5px;">Last updated: ' +
                        new Date().toLocaleTimeString() + '</div>';
                } else {
                    document.getElementById('webcamOverlay').textContent = '⚠️ No face detected';
                }
            } catch (error) {
                console.error('Prediction error:', error);
            }
        }
        
        window.onload = function() { testHealth(); };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection — Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            color: #eee;
        }

        h1 { text-align: center; font-size: 1.8em; margin-bottom: 4px; color: #e94560; }
        .api-url { text-align: center; font-size: 0.8em; color: #aaa; margin-bottom: 20px; word-break: break-all; }

        .layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
            max-width: 1100px;
            margin: 0 auto;
        }
        @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 18px;
        }
        .card h2 { font-size: 1em; margin-bottom: 12px; color: #e94560; }

        /* ── Video section ── */
        .video-wrap {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1); /* mirror */
        }
        #overlay {
            position: absolute;
            inset: 0;
            transform: scaleX(-1);
            pointer-events: none;
        }
        #startBtn, #stopBtn {
            margin-top: 10px;
            width: 48%;
            padding: 9px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        #startBtn { background: #e94560; color: #fff; }
        #stopBtn  { background: #374151; color: #eee; }
        #startBtn:disabled, #stopBtn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn-row { display: flex; gap: 8px; }

        .fps-bar {
            margin-top: 8px;
            font-size: 0.75em;
            color: #6b7280;
            display: flex;
            gap: 16px;
        }
        .fps-bar span { color: #9ca3af; }

        /* ── Sidebar ── */
        .sidebar { display: flex; flex-direction: column; gap: 14px; }

        /* Status */
        .status-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.82em;
        }
        .status-row:last-child { border-bottom: none; }
        .badge { padding: 2px 10px; border-radius: 20px; font-size: 0.78em; font-weight: 600; }
        .badge.ok      { background: #1a472a; color: #4ade80; }
        .badge.err     { background: #7f1d1d; color: #f87171; }
        .badge.pending { background: #374151; color: #9ca3af; }

        /* Live result */
        .emotion-big { text-align: center; padding: 10px 0 6px; }
        .emotion-emoji { font-size: 3.5em; line-height: 1; }
        .emotion-label {
            font-size: 1.5em; font-weight: 700; text-transform: capitalize;
            color: #e94560; margin-top: 4px;
        }
        .emotion-conf { font-size: 0.82em; color: #9ca3af; margin-top: 2px; }
        .no-face { text-align: center; color: #4b5563; font-size: 0.85em; padding: 20px 0; }

        /* Bars */
        .bar-row { margin-bottom: 5px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 0.75em; margin-bottom: 2px; text-transform: capitalize; }
        .bar-bg { height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; background: #e94560; border-radius: 3px; transition: width 0.3s ease; }
        .bar-fill.top { background: #4ade80; }

        /* Image upload fallback */
        .upload-area {
            border: 2px dashed rgba(233,69,96,0.4); border-radius: 10px;
            padding: 18px; text-align: center; cursor: pointer; transition: all 0.2s;
        }
        .upload-area:hover { border-color: #e94560; background: rgba(233,69,96,0.05); }
        #fileInput { display: none; }
        #imgPreview { max-width: 100%; border-radius: 8px; margin-bottom: 8px; display: none; }
        #analyzeBtn {
            width: 100%; padding: 8px; border: none; border-radius: 8px;
            background: #e94560; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.88em;
        }
        #analyzeBtn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* Model info */
        .info-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 0.78em; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-row:last-child { border-bottom: none; }
        .info-key { color: #9ca3af; }
        .info-val { color: #e2e8f0; font-weight: 500; text-align: right; word-break: break-all; max-width: 58%; }

        /* Raw */
        #rawJson { font-size: 0.7em; color: #6b7280; overflow: auto; max-height: 140px; white-space: pre-wrap; }
    </style>
</head>
<body>

<h1>Emotion Detection — Live</h1>
<p class="api-url" id="apiUrlLabel"></p>

<div class="layout">

    <!-- Left: webcam -->
    <div>
        <div class="card" style="margin-bottom:14px;">
            <h2>📹 Live Webcam</h2>
            <div class="video-wrap">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
            </div>
            <div class="btn-row" style="margin-top:10px;">
                <button id="startBtn">▶ Start Camera</button>
                <button id="stopBtn" disabled>⏹ Stop</button>
            </div>
            <div class="fps-bar">
                <div>Interval: <span id="intervalLabel">1000ms</span></div>
                <div>Last ping: <span id="pingLabel">—</span></div>
                <div>Faces: <span id="faceCount">—</span></div>
            </div>
            <input type="range" id="intervalSlider" min="500" max="5000" step="500" value="1000"
                style="width:100%;margin-top:8px;accent-color:#e94560;">
            <div style="font-size:0.72em;color:#6b7280;text-align:center;">Capture interval</div>
        </div>

        <!-- Image upload fallback -->
        <div class="card">
            <h2>🖼 Image Upload (static)</h2>
            <div class="upload-area" id="uploadArea">
                <div>📂 Click or drop image</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            <img id="imgPreview" alt="preview">
            <button id="analyzeBtn" disabled style="margin-top:8px;">Analyze</button>
        </div>
    </div>

    <!-- Right: sidebar -->
    <div class="sidebar">

        <!-- Health / model -->
        <div class="card">
            <h2>🩺 Status</h2>
            <div class="status-row"><span>/health</span><span class="badge pending" id="healthBadge">checking…</span></div>
            <div class="status-row"><span>/model/info</span><span class="badge pending" id="modelBadge">checking…</span></div>
            <div id="modelInfo" style="margin-top:10px;"></div>
        </div>

        <!-- Live emotion result -->
        <div class="card">
            <h2>😶 Live Result</h2>
            <div id="liveResult"><p class="no-face">Start camera to begin</p></div>
        </div>

        <!-- Probability bars -->
        <div class="card">
            <h2>📊 Probabilities</h2>
            <div id="liveBars"><p class="no-face">—</p></div>
        </div>

        <!-- Raw JSON -->
        <div class="card">
            <h2>📋 Raw Response</h2>
            <pre id="rawJson">—</pre>
        </div>

    </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
const API_URL = 'https://emotion-detection-api-25421.azurewebsites.net';
document.getElementById('apiUrlLabel').textContent = API_URL;

const EMOJI = {
    happy:'😊', sad:'😢', angry:'😠',
    shocked:'😲', fear:'😨', disgust:'🤢', neutral:'😐'
};

// ── Health / model ────────────────────────────────────────────────
async function checkHealth() {
    const b = document.getElementById('healthBadge');
    try {
        const r = await fetch(`${API_URL}/health`, { signal: AbortSignal.timeout(10000) });
        const d = await r.json();
        if (r.ok && d.status === 'healthy') { b.textContent = '✓ healthy'; b.className = 'badge ok'; }
        else { b.textContent = d.status || 'degraded'; b.className = 'badge err'; }
    } catch { b.textContent = 'unreachable'; b.className = 'badge err'; }
}

async function checkModel() {
    const b = document.getElementById('modelBadge');
    try {
        const r = await fetch(`${API_URL}/model/info`, { signal: AbortSignal.timeout(10000) });
        const d = await r.json();
        if (r.ok) {
            b.textContent = '✓ loaded'; b.className = 'badge ok';
            document.getElementById('modelInfo').innerHTML = [
                ['Type', d.model_type], ['Status', d.status],
                ['Labels', (d.emotion_labels||[]).join(', ')],
                ['Input', d.input_shape||'—'], ['Framework', d.framework||'—']
            ].map(([k,v])=>`<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v||'—'}</span></div>`).join('');
        } else { b.textContent = 'error'; b.className = 'badge err'; }
    } catch { b.textContent = 'unreachable'; b.className = 'badge err'; }
}

// ── Webcam ────────────────────────────────────────────────────────
const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const captureCanvas = document.getElementById('captureCanvas');
const ctx     = overlay.getContext('2d');
const startBtn = document.getElementById('startBtn');
const stopBtn  = document.getElementById('stopBtn');
const slider   = document.getElementById('intervalSlider');

let stream = null;
let captureTimer = null;
let isBusy = false;
let captureInterval = 1000;

slider.addEventListener('input', () => {
    captureInterval = parseInt(slider.value);
    document.getElementById('intervalLabel').textContent = captureInterval + 'ms';
    if (captureTimer) restartTimer();
});

startBtn.addEventListener('click', async () => {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        video.addEventListener('loadedmetadata', () => {
            overlay.width  = video.videoWidth;
            overlay.height = video.videoHeight;
        });
        restartTimer();
    } catch(e) {
        alert('Camera access denied: ' + e.message);
    }
});

stopBtn.addEventListener('click', () => {
    clearInterval(captureTimer);
    captureTimer = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    document.getElementById('liveResult').innerHTML = '<p class="no-face">Camera stopped</p>';
    document.getElementById('liveBars').innerHTML = '<p class="no-face">—</p>';
});

function restartTimer() {
    clearInterval(captureTimer);
    captureTimer = setInterval(captureAndPredict, captureInterval);
}

async function captureAndPredict() {
    if (isBusy || !stream) return;
    isBusy = true;
    const t0 = Date.now();

    // Draw frame to hidden canvas
    captureCanvas.width  = video.videoWidth  || 640;
    captureCanvas.height = video.videoHeight || 480;
    const cctx = captureCanvas.getContext('2d');
    cctx.drawImage(video, 0, 0);

    captureCanvas.toBlob(async blob => {
        const form = new FormData();
        form.append('file', blob, 'frame.jpg');
        try {
            const r = await fetch(`${API_URL}/predict`, { method: 'POST', body: form });
            const d = await r.json();
            const ping = Date.now() - t0;
            document.getElementById('pingLabel').textContent = ping + 'ms';
            document.getElementById('rawJson').textContent = JSON.stringify(d, null, 2);
            renderLive(d);
        } catch(e) {
            document.getElementById('liveResult').innerHTML =
                `<p class="no-face" style="color:#f87171">❌ ${e.message}</p>`;
        } finally { isBusy = false; }
    }, 'image/jpeg', 0.85);
}

function renderLive(d) {
    const faceCount = d.faces_detected || 0;
    document.getElementById('faceCount').textContent = faceCount;

    if (!d.success || faceCount === 0) {
        document.getElementById('liveResult').innerHTML = '<p class="no-face">😶 No face detected</p>';
        document.getElementById('liveBars').innerHTML = '<p class="no-face">—</p>';
        ctx.clearRect(0, 0, overlay.width, overlay.height);
        return;
    }

    const face  = d.results[0];
    const label = (face.emotion || '').toLowerCase();
    const emoji = EMOJI[label] || '😶';
    const conf  = ((face.confidence || 0) * 100).toFixed(1);

    // Overlay bounding box (note: canvas is mirrored via CSS so no extra flip needed)
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    if (face.bbox) {
        const { x, y, width, height } = face.bbox;
        // Mirror the x coordinate to match the CSS mirror on the video
        const mx = overlay.width - x - width;
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth   = 3;
        ctx.strokeRect(mx, y, width, height);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(mx, y - 26, width, 26);
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 14px Segoe UI';
        ctx.fillText(`${face.emotion} ${conf}%`, mx + 6, y - 8);
    }

    // Sidebar result
    document.getElementById('liveResult').innerHTML = `
        <div class="emotion-big">
            <div class="emotion-emoji">${emoji}</div>
            <div class="emotion-label">${face.emotion}</div>
            <div class="emotion-conf">${conf}% confidence</div>
        </div>`;

    // Probability bars
    const allProbs = face.all_probabilities || {};
    const bars = Object.entries(allProbs)
        .sort((a,b) => b[1]-a[1])
        .map(([emo, prob]) => {
            const pct = (prob*100).toFixed(1);
            const isTop = emo.toLowerCase() === label;
            return `<div class="bar-row">
                <div class="bar-label"><span>${emo}</span><span>${pct}%</span></div>
                <div class="bar-bg"><div class="bar-fill${isTop?' top':''}" style="width:${pct}%"></div></div>
            </div>`;
        }).join('');
    document.getElementById('liveBars').innerHTML = bars || '<p class="no-face">—</p>';
}

// ── Image upload ──────────────────────────────────────────────────
let selectedFile = null;
const uploadArea = document.getElementById('uploadArea');
const fileInput  = document.getElementById('fileInput');
const imgPreview = document.getElementById('imgPreview');
const analyzeBtn = document.getElementById('analyzeBtn');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor='#e94560'; });
uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor='');
uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor=''; if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if(fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => { imgPreview.src = e.target.result; imgPreview.style.display = 'block'; };
    reader.readAsDataURL(file);
    analyzeBtn.disabled = false;
}

analyzeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = 'Analyzing…';
    const form = new FormData();
    form.append('file', selectedFile);
    try {
        const r = await fetch(`${API_URL}/predict`, { method: 'POST', body: form });
        const d = await r.json();
        document.getElementById('rawJson').textContent = JSON.stringify(d, null, 2);
        renderLive(d);
    } catch(e) {
        document.getElementById('liveResult').innerHTML = `<p class="no-face" style="color:#f87171">❌ ${e.message}</p>`;
    } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyze';
    }
});

// ── Init ──────────────────────────────────────────────────────────
checkHealth();
checkModel();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection API Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #e8eaff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #d0d5ff;
            border-color: #764ba2;
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.85em;
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            margin: 20px auto;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 20px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #results {
            margin-top: 30px;
            display: none;
        }

        .result-card {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
        }

        .emotion {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .confidence {
            font-size: 1.1em;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .bbox {
            font-size: 0.9em;
            color: #666;
        }

        .error {
            background: #ffe6e6;
            border-left-color: #ff4444;
            color: #cc0000;
        }

        .success-info {
            background: #e6ffe6;
            border-left-color: #44ff44;
            color: #006600;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .api-url {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.85em;
            word-break: break-all;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😊 Emotion Detection</h1>
        <p class="subtitle">Upload a photo to detect facial emotions</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Click to upload or drag & drop</div>
            <div class="upload-subtext">PNG, JPG or JPEG (max 10MB)</div>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">
        </div>

        <img id="preview" alt="Preview">

        <button id="analyzeBtn" disabled>Analyze Emotion</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">Analyzing emotions...</p>
        </div>

        <div id="results"></div>

        <div class="api-url">
            <strong>API Endpoint:</strong><br>
            https://emotion-detection-api-g9budncvekdgewbk.eastasia-01.azurewebsites.net
        </div>
    </div>

    <script>
        const API_URL = 'https://emotion-detection-api-g9budncvekdgewbk.eastasia-01.azurewebsites.net';
        
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        
        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // Analyze button
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Show loading
            loading.style.display = 'block';
            results.style.display = 'none';
            analyzeBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch(`${API_URL}/predict`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Hide loading
                loading.style.display = 'none';
                analyzeBtn.disabled = false;

                // Display results
                displayResults(data);

            } catch (error) {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
                
                results.innerHTML = `
                    <div class="result-card error">
                        <strong>Error:</strong> ${error.message}<br>
                        Make sure the API is running and accessible.
                    </div>
                `;
                results.style.display = 'block';
            }
        });

        function displayResults(data) {
            results.innerHTML = '';

            if (data.success && data.faces_detected > 0) {
                // Success info
                const successInfo = document.createElement('div');
                successInfo.className = 'success-info';
                successInfo.innerHTML = `✅ <strong>Detected ${data.faces_detected} face(s)</strong>`;
                results.appendChild(successInfo);

                // Each face result
                data.results.forEach((result, index) => {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    
                    const confidencePercent = (result.confidence * 100).toFixed(1);
                    
                    card.innerHTML = `
                        <div class="emotion">${getEmotionEmoji(result.emotion)} ${result.emotion}</div>
                        <div class="confidence">Confidence: ${confidencePercent}%</div>
                        <div class="bbox">
                            Face ${index + 1} location: 
                            (x: ${result.bbox.x}, y: ${result.bbox.y}, 
                            width: ${result.bbox.width}, height: ${result.bbox.height})
                        </div>
                    `;
                    
                    results.appendChild(card);
                });
            } else if (data.success && data.faces_detected === 0) {
                results.innerHTML = `
                    <div class="result-card error">
                        😕 No faces detected in the image. 
                        Try uploading a photo with a clear face.
                    </div>
                `;
            } else {
                results.innerHTML = `
                    <div class="result-card error">
                        <strong>Error:</strong> ${data.error || 'Unknown error occurred'}
                    </div>
                `;
            }

            results.style.display = 'block';
        }

        function getEmotionEmoji(emotion) {
            const emojis = {
                'Happy': '😊',
                'Sad': '😢',
                'Angry': '😠',
                'Surprise': '😲',
                'Fear': '😨',
                'Disgust': '🤢',
                'Neutral': '😐'
            };
            return emojis[emotion] || '😊';
        }
    </script>
</body>
</html>
